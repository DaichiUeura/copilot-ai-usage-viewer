# Production deploy template — hourly build of the org-level AI credit usage Overview to GitHub Pages.
#
# This is a TEMPLATE; it lives in automation/ so it does not run here. Copy it to
# .github/workflows/update-overview.yml in your own private repo and configure the secret,
# variable, and Pages source — see automation/README.md ("Deploying with the workflow").
name: Update AI credit usage Overview

on:
  schedule:
    # Hourly at :17 — off the top of the hour, where scheduled runs queue up.
    # The newest day is the current UTC day, which the API reports as it accumulates.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let an in-flight deployment finish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # This template always targets the current UTC month, day 1 through the run
      # date — day 1 is a partial D-0 Overview that fills in as the API accumulates
      # it. fetch.mjs and transform.mjs take this range explicitly rather than
      # working a month out for themselves; pass a different FROM_DAY/THROUGH_DAY
      # here to build a full past month instead.
      - name: Compute the current UTC month range
        id: range
        run: |
          # One clock reading for both ends, so a run that starts as the UTC
          # month rolls over cannot pair a stale month start with a new day.
          today=$(date -u +%Y-%m-%d)
          echo "from_day=${today%-*}-01" >> "$GITHUB_OUTPUT"
          echo "through_day=$today" >> "$GITHUB_OUTPUT"

      - name: Fetch usage (raw JSON)
        env:
          AI_USAGE_PAT: ${{ secrets.AI_USAGE_PAT }}
          ORG: ${{ vars.ORG || github.repository_owner }}
          FROM_DAY: ${{ steps.range.outputs.from_day }}
          THROUGH_DAY: ${{ steps.range.outputs.through_day }}
          RAW_DIR: ./out/raw
        run: node automation/scripts/fetch.mjs

      - name: Build CSV into the site directory
        env:
          RAW_DIR: ./out/raw
          FROM_DAY: ${{ steps.range.outputs.from_day }}
          THROUGH_DAY: ${{ steps.range.outputs.through_day }}
          OUT_CSV: ./site/data/ai-credit-usage.csv
        run: node automation/scripts/transform.mjs

      - name: Assemble site (viewer + CSV only)
        run: cp index.html ./site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - id: deploy
        uses: actions/deploy-pages@v5
